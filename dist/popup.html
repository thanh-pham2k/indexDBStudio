<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #eef2ff 0%, #f8fafc 100%);
      color: #172033;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      display: block;
      margin: 0 auto 10px;
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(79, 70, 229, 0.24);
    }
    h2 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #4338ca;
    }
    p {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    .shortcut {
      font-family: monospace;
      background: #e0e7ff;
      padding: 2px 6px;
      border-radius: 4px;
      color: #3730a3;
    }
  </style>
</head>
<body>
  <img class="logo" src="icons/icon-128.png" alt="IndexedDB Query Studio icon">
  <h2>IndexedDB Query Studio</h2>
  <p>This is a DevTools Extension.</p>
  <p>Please open Chrome Developer Tools (<span class="shortcut">F12</span> or <strong>Right Click → Inspect</strong>) and select the <strong>"IndexedDB Studio"</strong> tab to query your databases!</p>
</body>
</html>
