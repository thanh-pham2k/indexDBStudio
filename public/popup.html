<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1329;
      color: #f1f5f9;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .logo {
      font-size: 24px;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #818cf8;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    .shortcut {
      font-family: monospace;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="logo">⚡</div>
  <h2>IndexedDB Query Studio</h2>
  <p>This is a DevTools Extension.</p>
  <p>Please open Chrome Developer Tools (<span class="shortcut">F12</span> or <strong>Right Click -> Inspect</strong>) and select the <strong>"IndexedDB Studio"</strong> tab to query your databases!</p>
</body>
</html>
